apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - base.yaml
patches:
  - target:
      kind: ValidatingPolicy
    patch: |-
      - op: replace
        path: /apiVersion
        value: policies.kyverno.io/v1
      - op: replace
        path: /spec/validationActions
        value:
          - Deny
